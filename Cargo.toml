[package]
name = "deskrouter"
version = "0.1.0"
edition = "2021"
description = "Trading-desk order-routing service with an LLM agent (security validation fixture)"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
async-trait = "0.1"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-postgres = "0.7"
tracing = "0.1.44"
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"

[[bin]]
name = "deskrouter"
path = "src/main.rs"
