# POSITIVE CONTROL: SHA-pinned, least-privilege, read-only tools.
name: Claude PR Review (safe)
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Claude review
        uses: anthropics/claude-code-action@6d3c8e9a5b2f1e0d4c7a9b8e2f1d0c3a5b6e7f80 # pinned
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this PR for bugs. Do not modify files."
          claude_args: "--allowedTools read,list_files"
