name: Queue PR auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

# Enabling auto-merge needs contents: write as well; the job never checks out
# pull request code, it only queues the merge.
permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    name: Queue auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
